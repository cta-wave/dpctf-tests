<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebTransport Connect To Server</title>
    <link rel="stylesheet" href="../lib/style.css" />
    <script src="/resources/testharness.js"></script>
    <script src="/resources/testharnessreport.js"></script>
  </head>

  <body>
    <div id="content-wrapper">
      <div id="video-wrapper">
        <video></video>
        <div><div id="qr-code"></div></div>
        <div><div id="status-text"></div></div>
      </div>
      <div>To show/hide debug overlay press up/down or button beneath</div>
      <div id="debug-wrapper">
        <div>
          <div class="button" id="debug-button">Debug Overlay</div>
        </div>
        <div id="debug"></div>
        <div id="log"></div>
      </div>
    </div>
    <div id="info-overlay"></div>
    <script src="../lib/mozilla/object-keys-polyfill.js"></script>
    <script src="../lib/stefanpenner/es6-promise.min.js"></script>
    <script src="../lib/davidshimjs/qrcode.js"></script>

    <script src="../lib/logger.js"></script>
    <script src="../lib/event-emitter.js"></script>
    <script src="../lib/player.js"></script>
    <script src="../lib/hbbtv.js"></script>
    <script src="../lib/manifest_parser.js"></script>
    <script src="../lib/mpd-parser.js"></script>
    <script src="../lib/wave-service.js"></script>
    <script src="../lib/dpctf-testharness.js"></script>
    <script>
      // Global variables
      var TEST_INFO = {
        id: "webtransport-connect-to-server",
        title: "WebTransport Connect To Server",
        description:
          "Validate that a WebTransport connection can be established to a configured server URL.",
        code: "webtransport-connect-to-server-https.html",
      };

      var video = document.querySelector("video");
      var qrCode = document.getElementById("qr-code");
      var statusText = document.getElementById("status-text");

      var logger = new Logger();

      var dpctfTest = new DpctfTest({
        testInfo: TEST_INFO,
        videoElement: video,
        qrCodeElement: qrCode,
        statusTextElement: statusText,
        infoOverlayElement: document.getElementById("info-overlay"),
        executeTest: executeTest,
        usePlayout: false,
        logger: logger,
      });

      function executeTest(player, done, parameters) {
        var serverUrl = parameters.webTransportServerUrl;
        var connectTimeoutMs = parameters.connectTimeoutMs || 10000;

        dpctfTest.asyncTest(function (test) {
          if (!serverUrl) {
            test.done();
            test.status = 3;
            test.message = "No web_transport_server_url provided; skipping connection attempt";
            return;
          }

          assert_true("WebTransport" in window, "WebTransport constructor should exist on window");

          var transport;
          try {
            transport = new WebTransport(serverUrl);
          } catch (error) {
            assert_unreached(
              "Failed to create WebTransport with web_transport_server_url: " + error
            );
            test.done();
            return;
          }

          function closeTransport() {
            if (!transport || typeof transport.close !== "function") {
              return;
            }
            try {
              transport.close();
            } catch (error) {
              // Ignore close errors because connection establishment is the only assertion.
            }
          }

          var timeoutId = setTimeout(function () {
            closeTransport();
            assert_unreached(
              "Timed out while connecting to WebTransport server at " + serverUrl
            );
            test.done();
          }, connectTimeoutMs);

          transport.ready
            .then(function () {
              clearTimeout(timeoutId);
              closeTransport();
              assert_true(true, "Successfully connected to WebTransport server");
              test.done();
            })
            .catch(function (error) {
              clearTimeout(timeoutId);
              closeTransport();
              assert_unreached("WebTransport connection failed: " + error);
              test.done();
            });
        }, "Connect to WebTransport server");

        done();
      }
    </script>
  </body>
</html>
